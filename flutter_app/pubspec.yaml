name: catalog
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^2.0.0
  flutter_riverpod: ^3.4.3
  riverpod_annotation: ^4.0.7
  go_router: ^18.0.2
  dio: ^5.11.1
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0
  shared_preferences: ^2.5.6
  intl: any
  flutter_localizations:
    sdk: flutter
  theme_extensions_builder_annotation: 7.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.15.1
  riverpod_generator: ^4.0.9
  freezed: ^4.0.2
  json_serializable: ^6.14.1
  mocktail: ^1.0.5
  integration_test:
    sdk: flutter
  riverpod_lint: ^3.1.9
  theme_extensions_builder: 7.5.0
  shared_preferences_platform_interface: ^2.4.2

flutter:
  generate: true
  uses-material-design: true
  fonts:
    - family: AlumniSans
      fonts:
        - asset: assets/fonts/AlumniSans.ttf
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter.ttf
